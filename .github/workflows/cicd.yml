# Cloud Dimensions - ServiceNow CI/CD lab pipeline
# Branch: main (Lab 4 / Lesson 8 - Run an ATF Suite and Instance Scan in a Pipeline)

name: CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Job-level ServiceNow pipeline credentials
    env:
      nowUsername: ${{ secrets.SN_USERNAME }}
      nowPassword: ${{ secrets.SN_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Resolve the ServiceNow instance name
      - name: Resolve ServiceNow instance
        env:
          RAW: ${{ vars.SN_INSTANCE_DOMAIN }}
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::SN_INSTANCE_DOMAIN is not set. Add it under Settings, then Secrets and variables, then Actions, on the Variables tab."
            exit 1
          fi

          INSTANCE=$(printf '%s' "$RAW" \
            | tr -d '[:space:]' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's#^[a-z][a-z0-9+.-]*://##' \
                  -e 's#^//##' \
                  -e 's#/.*$##' \
                  -e 's#^[^a-z0-9]*##' \
                  -e 's#[^a-z0-9]*$##' \
                  -e 's#\.service-now\.com$##')

          case "$INSTANCE" in
            ''|*[!a-z0-9.-]*|-*|*-|.*|*.|*..*)
              echo "::error::SN_INSTANCE_DOMAIN could not be read as an instance name."
              echo "::error::You entered: $RAW"
              echo "::error::Expected something like: your-instance-id.lab"
              echo "::error::Enter the instance name only - no https://, no angle brackets, no quotes."
              exit 1
              ;;
          esac

          echo "Resolved ServiceNow instance: $INSTANCE"
          echo "SN_INSTANCE=$INSTANCE" >> "$GITHUB_ENV"

      # Apply committed changes to ServiceNow
      - name: Apply changes
        uses: ServiceNow/sncicd-apply-changes@d9e560381b65fc450f8dc85b084c1a6cc40e503c
        continue-on-error: true
        env:
            nowSourceInstance: ${{ env.SN_INSTANCE }}
          appScope: x_cd_grc_app

      # Part 1 - Run ATF Test Suite
      - name: Run ATF test suite
        uses: ServiceNow/sncicd-tests-run@2.0.0
        with:
          testSuiteSysId: 90f283440db503107f44aad64471050b
        env:
              nowInstallInstance: ${{ env.SN_INSTANCE }}

      # Part 2 - Run Instance Scan
      - name: Run Instance Scan
        uses: ServiceNow/sncicd-instance-scan@2.0.0
        with:
          scantype: suite_scoped
          suiteSysId: 6237eabc53203010b846ddeeff7b12c3
          appScopeSysIds: 7f0cfe480d7503107f44aad6447105bd
        env:
          nowScanInstance: ${{ env.SN_INSTANCE }}
